# Render Blueprint: public synthetic GrowthFlow demo only.
# Static hosting means no live CRM tokens, backend, or personal data are deployed.
services:
  - type: web
    name: growthflow-portfolio-demo
    runtime: static
    buildCommand: echo "GrowthFlow v1.5 commercial workspace is prebuilt"
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
